<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kosa Krsha</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #fff8e1;
      color: #333;
      font-family: 'Arial', 'Comic Sans MS', cursive, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 72px;
      margin-bottom: 40px;
      color: #ff4081;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    h1 span {
      color: #333;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 320px;
    }

    .menu button {
      font-size: 26px;
      padding: 16px;
      background: #fff;
      color: #333;
      border: 2px solid #ccc;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }

    .menu button:focus {
      outline: none;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
      }
      
      .menu {
        width: 280px;
      }
      
      .menu button {
        font-size: 22px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <h1><span>KOSA KRSHA</span><br>THE GAME</h1>

  <div class="menu">
    <button onclick="location.href='infinite.html'">🎮 Infinite Mode</button>
    <button onclick="location.href='special.html'">💛 Special Mode</button>
    <button onclick="alert('🐟 Catch treats and avoid bombs!\n\nInfinite Mode: Endless fun!\nSpecial Mode: Toto Special Mode!\n\nIf you\'re reading this, then you\'re the most beautiful woman to ever exist!')">ℹ️ Info</button>
  </div>
</body>
</html>
