<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meow 🎉</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="birthday">
  <h1>🎂 Happy Birthday Toto! 🎉</h1>
  <p>You caught all the treats! Kosa is happy now, just like how I'm happy that you're here by my side.<br>Every single day that passes by, as you're growing older, I love you beyond infinity and I always will. ❤️</p>
  <img src="kosahappy.png" alt="Happy Kosa!" class="toto-img" style="width: 780px;">
  
  <!-- Audio with autoplay and muted for compatibility -->
  <audio id="bg-music" autoplay loop muted>
    <source src="mecat.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- JavaScript to unmute audio after the user clicks -->
  <script>
    const music = document.getElementById("bg-music");

    // Unmute music on first click
    window.addEventListener("click", () => {
      music.muted = false;
      music.play();
    });
  </script>
</body>
</html>
